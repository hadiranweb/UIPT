[package]
name = "onsour_governance"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sha2 = "0.10"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "governance_bench"
harness = false
