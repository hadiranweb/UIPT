[workspace]
members = [
    "core/rts_core",
    "core/rts_wasm",
    "runtime",
    "synaptic-hub",
    "islands/commerce_reef",
    "islands/finance_lagoon",
    "core/onsour_governance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["ONSOUR Team"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tokio = { version = "1.0", features = ["full"] }
rayon = "1.8"
rand = "0.8"
rand_distr = "0.4"
log = "0.4"
env_logger = "0.10"
