[workspace]
members = [
    "core/rts_core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["ONSOUR Team"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
tokio = { version = "1.0", features = ["full"] }
